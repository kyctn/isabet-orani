<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İsabet Oranı · Bet Builder</title>
<style>
:root{
  --bg:#0b0d10; --panel:#13161b; --panel2:#181c22; --line:#252a32; --text:#e8eaed; --muted:#8a919c;
  --green:#3ddc84; --green-bg:#16362a; --yellow:#e6c14a; --yellow-bg:#3a3317; --red:#a7333d; --grey:#3a3f47;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header .logo{font-weight:800;font-size:17px;white-space:nowrap}
header .status{color:var(--muted);font-size:12px}
.frtgl{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:#3a414c}
.btn.green{background:var(--green-bg);border-color:#1f5a40;color:var(--green)}
.tabs{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.tab{background:none;border:0;border-radius:7px;padding:6px 11px;color:var(--muted);font-weight:600}
.tab span{opacity:.7;font-weight:500;margin-left:3px}
.tab.on{background:#2a2f37;color:var(--text)}
h1{font-size:24px;margin:20px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:600}
.chip span{color:var(--muted);font-weight:500;margin-left:4px}
.chip.on{border-color:var(--green);color:var(--green);background:#0f2219}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
.spacer{flex:1}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--panel2)}
.lg{width:30px;height:30px;border-radius:7px;background:#1f242b;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);flex:none;overflow:hidden}
.pair{position:relative;width:38px;height:30px;flex:none}
.pair .tl{position:absolute;width:24px;height:24px}
.pair .tl:first-child{left:0;top:0}.pair .tl:last-child{right:0;bottom:0}
.tl{display:inline-grid;place-items:center;width:18px;height:18px;flex:none;border-radius:50%;background:#1f242b;font-size:8px;font-weight:700;color:var(--muted);overflow:hidden;vertical-align:middle}
.tl img{width:100%;height:100%;object-fit:contain}
.tl.has{background:none}
.mlogos{display:flex;gap:8px;align-items:center}.mlogos .tl{width:34px;height:34px;font-size:11px}
.row .t{font-weight:700;font-size:15px}
.row .m{color:var(--muted);font-size:12.5px}
.row .avg{color:var(--muted);font-size:12px;min-width:90px;text-align:right}
.badge{border-radius:6px;padding:3px 8px;font-weight:700;font-size:12.5px;white-space:nowrap}
.b-g{background:var(--green-bg);color:var(--green)}
.b-y{background:var(--yellow-bg);color:var(--yellow)}
.b-n{background:#262a31;color:#b9bec6}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;color:var(--muted)}
.pager .btn{border-radius:50%;width:34px;height:34px;padding:0}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* match page */
.crumb{color:var(--muted);font-size:12.5px}
.mhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mhead h1{margin:6px 0 4px}
.mhead .when{margin-left:auto;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:14px 0}
.controls .lbl{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.05em}
.layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card.strong{border-color:#1f4a37}
.ctop{display:flex;gap:10px;padding:12px 12px 8px}
.rank{color:var(--muted);font-size:11px;width:16px;padding-top:2px}
.ctop .t{font-weight:700}
.ctop .s{color:var(--muted);font-size:12px}
.add{margin-left:auto;width:28px;height:28px;border-radius:50%;background:#262b33;border:0;font-size:17px;flex:none}
.add.on{background:var(--green);color:#0b0d10}
.cbot{display:flex;gap:14px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.side{display:flex;gap:6px;align-items:center}
.tm{font-size:10px;font-weight:700;color:var(--muted);background:#1f242b;border-radius:4px;padding:2px 4px}
.strip{display:flex;gap:2px}
.strip i{width:4px;height:13px;border-radius:1px;background:var(--grey)}
.strip i.h{background:var(--green)} .strip i.x{background:var(--red)}
.more{margin-left:auto;background:#1c2027;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted);font-size:11.5px;font-weight:600}
.cbot{cursor:pointer}.cbot:hover .more{color:var(--text);border-color:#3a414c}
.gtbl td{vertical-align:middle}.gtbl th[colspan]{color:var(--text);font-size:12.5px;padding:8px 4px}
.gopp{display:inline-flex;gap:6px;align-items:center}.gopp .tl{width:16px;height:16px;font-size:7px}
.glg{display:block;color:var(--muted);font-size:10.5px;margin-left:22px}
.gven{color:var(--muted)}.gok td:first-child{box-shadow:inset 3px 0 var(--green)}.gno td:first-child{box-shadow:inset 3px 0 var(--red)}
.detail{padding:0 12px 12px;display:none}
.card.open .detail{display:block}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600}
.ok{color:var(--green)} .no{color:#e46a74}
.slip{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.slip h3{margin:0 0 10px;font-size:15px}
.slip .leg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.slip .leg button{background:none;border:0;color:var(--muted)}
.slip .hint{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px}
.combo{margin-top:12px;font-size:13px}
.combo .lineitem{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
summary{cursor:pointer;margin-bottom:8px}
.note{color:var(--muted);font-size:11.5px;margin-top:8px}
/* ---------- odds ---------- */
.mv{font-size:11px;margin-right:4px;white-space:nowrap}.mv.dn{color:#6cb6ff}.mv.up{color:#b9bec6}
.dq{display:inline-block;font-size:10.5px;color:var(--yellow);background:var(--yellow-bg);border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.odd{display:inline-block;font-weight:800;color:var(--text);background:#1d2733;border:1px solid #2b3a4d;border-radius:6px;padding:2px 7px;font-size:13px;white-space:nowrap}
.oddcell{text-align:center}.oddcell small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.val{font-weight:800;text-align:center}.val small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.v-pos{color:var(--green)}.v-neg{color:#e46a74}.v-0{color:var(--muted)}
.chkrow{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-top:10px;cursor:pointer}
/* ---------- takip ---------- */
.tsum{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.tsum div{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tsum span{display:block;color:var(--muted);font-size:12px}.tsum b{font-size:22px}
.th3{margin:22px 0 4px;font-size:15px}
.dpick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.abgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin:8px 0}
.abcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.abcard h4{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.abcard .meta{color:var(--muted);font-size:12px;margin:2px 0 6px}
.abfoot{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:12.5px}
.abfoot span{color:var(--muted)}.abfoot b{font-size:15px;margin-left:4px}
.kupon{border-color:var(--accent,#2fbf71)}
.dmatch{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.dmatch h4{margin:0 0 2px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.dmatch h4 .sc{font-variant-numeric:tabular-nums}
.dleg{display:grid;grid-template-columns:22px minmax(0,1fr) 70px 52px 46px;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.dleg small{color:var(--muted);display:block}
.dleg .r{font-weight:700;text-align:center}
@media(max-width:760px){.dleg{grid-template-columns:20px minmax(0,1fr) 44px 40px}.dleg .hist{display:none}}
.ttbl td,.ttbl th{text-align:left;font-size:12.5px;padding:9px 12px}
/* ---------- nav ---------- */
.nav{display:flex;gap:4px;margin-left:18px}
.nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600}
.nav a.on{background:#232830;color:var(--text)}
/* ---------- screener ---------- */
.scr{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.scr{grid-template-columns:1fr}}
.fbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.fbox h4{margin:0 0 10px;font-size:15px}
.flbl{display:flex;justify-content:space-between;color:var(--text);font-size:12.5px;font-weight:600;margin:12px 0 6px}
.flbl span{color:var(--muted);font-weight:500}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;background:none;border:0;border-radius:6px;padding:6px 6px;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap}
.seg button.on{background:#2a2f37;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--green)}
.lglist{max-height:240px;overflow:auto;margin-top:8px;font-size:12.5px}
.lglist label{display:flex;gap:6px;align-items:center;padding:3px 0;cursor:pointer}
.lglist label span{margin-left:auto;color:var(--muted)}
.search{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.mtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600}
.mtabs button.on{color:var(--text);border-color:var(--green)}
.mtabs button span{color:var(--muted);font-weight:500;margin-left:4px;font-size:12px}
.stbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px;font-size:13px}
.stbl th{color:var(--muted);font-size:11px;letter-spacing:.05em;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.stbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.stbl tr.r{cursor:pointer}.stbl tr.r:hover td{background:var(--panel2)}
.tcell{display:flex;gap:12px;align-items:center}
.tcell .tl{width:32px;height:32px;font-size:10px}
.tname{font-weight:700;font-size:14px}
.vs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-top:3px;flex-wrap:wrap}
.vs .chip{display:inline-flex;gap:5px;align-items:center;background:#1c2027;border-radius:6px;padding:2px 7px}
.vs .chip b{color:var(--text);font-weight:600}
.vs .tl{width:15px;height:15px;font-size:7px}
.mk b{display:block;font-weight:700}.mk span{color:var(--muted);font-size:12.5px}
.pct{font-weight:800;font-size:14px;text-align:center}
.pct small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.p-g{color:var(--green)}.p-y{color:var(--yellow)}.p-n{color:#b9bec6}
.cbtn{width:32px;height:32px;border-radius:50%;background:#232830;border:0;color:var(--muted)}
/* ---------- drawer ---------- */
.dshade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:#101318;border-left:1px solid var(--line);z-index:21;overflow:auto;padding:16px 18px 40px}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dhead .tl{width:40px;height:40px;font-size:12px}
.dhead h3{margin:0;font-size:18px}
.dhead .sub2{color:var(--muted);font-size:13px;margin-top:2px}
.dhead .x{background:none;border:0;color:var(--muted);font-size:20px}
.dteams{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 10px}
.dteams button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;background:none;border:0;border-radius:9px;padding:9px;color:var(--muted);font-weight:700}
.dteams button.on{background:#232830;color:var(--text)}
.dteams .tl{width:18px;height:18px}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.drow .seg{flex:none}.drow .seg button{padding:6px 12px}
.stabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.stabs button{background:none;border:0;padding:8px 12px;color:var(--muted);font-weight:600;border-radius:8px 8px 0 0}
.stabs button.on{background:#232830;color:var(--text)}
.dsum{display:flex;gap:18px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.dsum div{font-size:12px;color:var(--muted)}
.dsum b{display:block;font-size:20px;color:var(--text);margin-top:2px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:12px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
.ctrls{display:flex;gap:10px;justify-content:center;margin-top:10px}
.stepper{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px}
.stepper button{background:none;border:0;color:var(--muted);font-size:16px;width:22px}
.stepper b{min-width:30px;text-align:center}
/* ---------- genel düzen ---------- */
.nav a{white-space:nowrap}
.mobonly{display:none}
@media (max-width: 1100px){
  header .status{display:none}
}
/* ---------- telefon ---------- */
@media (max-width: 760px){
  body{font-size:13.5px}
  .wrap{padding:12px 10px 50px}
  header{gap:8px;margin-bottom:12px}
  header .logo{font-size:15px}
  #cfg{margin-left:auto}
  .nav{order:5;width:100%;margin:0;overflow-x:auto;scrollbar-width:none}
  .nav a{padding:7px 11px;font-size:13px}
  .frtgl{order:6;margin-left:0;font-size:12px;padding:5px 8px}
  h1{font-size:20px;margin:12px 0 4px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .tab{white-space:nowrap}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chip{white-space:nowrap}
  .controls{gap:8px;padding:8px}
  .controls .seg{flex-wrap:nowrap}
  .row{flex-wrap:wrap;gap:8px 10px;padding:12px}
  .row .avg{display:none}
  .row > div[style*="flex:1"]{flex-basis:calc(100% - 50px)}
  .row .t{font-size:14px}
  .ctop .t{font-size:13.5px}
  .cbot{gap:8px}
  .strip i{width:3px}
  .mhead h1{font-size:19px}
  .mhead .when{margin-left:0;width:100%}
  .mobonly{display:inline-block;margin:0 0 10px}
  .fpanel{display:none}.fpanel.open{display:block}
  .scr > section, .scr > aside, .layout > *, .grid > *{min-width:0}
  .ttbl{display:block;overflow-x:auto;white-space:nowrap}
  /* Prop Screener: satır başına kart */
  .scrtbl, .scrtbl tbody{display:block}
  .scrtbl tr:first-child{display:none}
  .scrtbl tr.r{display:grid;grid-template-columns:1fr 1fr 1fr auto;border-bottom:1px solid var(--line);padding:10px 4px}
  .scrtbl tr.r td{border:0;padding:4px 8px}
  .scrtbl tr.r td:nth-child(1){grid-column:1 / -1}
  .scrtbl tr.r td:nth-child(2){grid-column:1 / 4}
  .scrtbl tr.r td:nth-child(3){grid-column:4;text-align:right}
  .scrtbl tr.r td:nth-child(7){align-self:center}
  .scrtbl td[data-l]::before{content:attr(data-l);display:block;color:var(--muted);font-size:10.5px;font-weight:500;margin-bottom:2px}
  .scrtbl .vs{gap:4px}
  .stbl td,.stbl th{padding:8px 10px}
  .tcell .tl{width:26px;height:26px}
  .tsum div{min-width:calc(50% - 6px);padding:10px}
  .tsum b{font-size:18px}
  .drawer{padding:12px 12px 40px}
  .dsum{gap:12px}.dsum b{font-size:17px}
  .stabs{flex-wrap:nowrap;overflow-x:auto}
  .slip{position:static}
  .list .pager{padding:10px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#/">⚽ İsabet Oranı</a>
    <nav class="nav"><a href="#/" id="nav-bb">Bet Builder</a><a href="#/screener" id="nav-ps">Prop Screener</a><a href="#/value" id="nav-vl">Değerli Oranlar</a><a href="#/track" id="nav-tk">Takip</a><a href="#/days" id="nav-dy">Günlük Sonuçlar</a><a href="#/ai" id="nav-ai">AI-Builder</a></nav>
    <label class="frtgl" title="Kapalıyken hazırlık maçları hem takımların geçmişinden hem de fikstürden çıkarılır"><input type="checkbox" id="frToggle"> Hazırlık maçlarını dahil et</label>
    <span class="status" id="status"></span>
    <button class="btn" id="cfg" title="Veri kaynağını değiştir">⚙</button>
  </header>
  <main id="app"></main>
  <footer id="foot" style="margin-top:28px;color:var(--muted)"></footer>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GUN = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const todayStr = () => new Date().toLocaleDateString("sv-SE");
const tomorrowStr = () => { const d = new Date(); d.setDate(d.getDate()+1); return d.toLocaleDateString("sv-SE"); };
function dayLabel(d){ if(d===todayStr())return "Bugün"; if(d===tomorrowStr())return "Yarın"; const x=new Date(d+"T12:00"); return `${GUN[x.getDay()]} ${x.getDate()}`; }
function when(ko){ return `${dayLabel(ko.slice(0,10))} ${ko.slice(11,16)}`; }
const badgeCls = r => r >= 0.8 ? "b-g" : r >= 0.6 ? "b-y" : "b-n";
const short = t => esc(t.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü ]/g,"").slice(0,3).toUpperCase());
const strip = hits => `<span class="strip">${hits.map(h => `<i class="${h===1?"h":h===0?"x":""}"></i>`).join("")}</span>`;
const initials = t => esc(String(t||"").replace(/\(.*?\)/g,"").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase());
function logo(team){
  const p = DB && DB.logos ? DB.logos[team] : null;

function legOddFull(fx, l){                  // Bet Builder ayağı -> { odd, p (marjsız olasılık), fair }

  const norm = arr => { if (!arr || arr.some(x => !x)) return null; const s = arr.reduce((a, x) => a + 1 / x, 0); return arr.map(x => (1 / x) / s); };
  if (mid === "btts" || mid === "btts_no") { const i = mid === "btts" ? 0 : 1, f = norm(o.btts); return o.btts ? out(o.btts[i], f && f[i], "btts||" + "yn"[i]) : null; }

  if (/^r_(1x|12|x2)$/.test(mid)) {

    return o.dc ? out(o.dc[i], f ? [f[0] + f[1], f[0] + f[2], f[1] + f[2]][i] : null, "dc||" + ["1X", "12", "X2"][i]) : null;
  }

  const fam = m[1], i = m[2] === "o" ? 1 : 0, L = m[3];
  const key = { goals: "g", htgoals: "htg", corners: "c", cards: "k", shots: "ts", sot: "tsot",

async function loadDB(){

  const d = await r.json();
  const limit = Date.now() - 2 * 3600e3;

    .map((f, i) => ({ id: i, div: f.div, home: f.home, away: f.away, kickoff: localStr(new Date(f.kickoff)), league: d.leagues[f.div] || f.div, odds: f.odds || null, iddaa: f.iddaa || null, friendly: isFriendly(f.div) }));

const CATS = ["Gol","Sonuç","Korner","Kart","Şut"];

function evalMk(mk, g, role){
  if (mk.scope === "result") {
    const o = role === "home" ? {W:"H",D:"D",L:"A"}[g.res] : {W:"A",D:"D",L:"H"}[g.res];
    return [o, mk.outcomes.includes(o)];
  }
  if (mk.kind === "yes") { const v = mk.yes(g); return [v ? 1 : 0, !!v]; }
  const v = mk.stat(g);
  if (v == null) return [null, null];
  return [v, mk.kind === "over" ? v > mk.line : v < mk.line];
}
function side(mk, team, role, games){
  const strip = [], values = [];
  for (const g of games) { const [v, h] = evalMk(mk, g, role); values.push(v); strip.push(h == null ? null : (h ? 1 : 0)); }
  const valid = strip.filter(h => h != null);
  if (valid.length < Math.max(3, Math.floor(games.length / 2))) return null;
  const hits = valid.reduce((a, b) => a + b, 0);
  const nums = values.filter(v => typeof v === "number");
  return { team, role, hits, total: valid.length, rate: hits / valid.length, strip, values,
           avg: nums.length && mk.scope !== "result" && mk.kind !== "yes" ? Math.round(nums.reduce((a,b)=>a+b,0) / nums.length * 100) / 100 : null };
}
function mkLeg(mk, home, away, sides, subject){
  const rates = sides.map(s => s.rate), sfx = subject ? "@" + subject : "";
  return { id: mk.id + sfx, cat: mk.cat, family: mk.family + sfx, kind: mk.kind, line: mk.line, subject,
           label: mk.label.replace("{T}", subject || "").replace("{H}", home).replace("{A}", away), sides,
           rate: rates.reduce((a,b)=>a+b,0) / rates.length, min_rate: Math.min(...rates), n_hits: sides.reduce((a,s)=>a+s.hits,0) };
}
function markStrongest(legs, thr, fx){
  // Her ailede eşiği geçen çizgiler arasından: önce iddaa'da oranı olanlar, sonra en zor çizgi
  const best = {};
  for (const l of legs) {
    l.strongest = false;
    if (l.min_rate < thr) continue;
    l._odd = fx ? !!legOdd(fx, l) : false;
    const c = best[l.family];
    if (!c || (l._odd && !c._odd)) { best[l.family] = l; continue; }
    if (c._odd && !l._odd) continue;
    if (l.kind === "yes" || (l.kind === "over" && l.line > c.line) || (l.kind === "under" && l.line < c.line)) best[l.family] = l;
  }
  Object.values(best).forEach(l => l.strongest = true);
}
function evaluate(home, away, n, split, thr, fx){
  const hg = teamGames(home, n, split ? "home" : null), ag = teamGames(away, n, split ? "away" : null), legs = [];
  for (const mk of MARKETS) {
    if (mk.scope === "team") {
      for (const [t, r, g] of [[home, "home", hg], [away, "away", ag]]) { const s = side(mk, t, r, g); if (s) legs.push(mkLeg(mk, home, away, [s], t)); }
    } else {
      const a = side(mk, home, "home", hg), b = side(mk, away, "away", ag);
      if (a && b) legs.push(mkLeg(mk, home, away, [a, b], null));
    }
  }
  markStrongest(legs, thr, fx);
  legs.sort((x, y) => y.rate - x.rate || y.min_rate - x.min_rate || y.n_hits - x.n_hits);
  const pub = gs => gs.map(g => ({ date: g.date, opp: g.opp, venue: g.venue, score: `${g.gf}-${g.ga}`, res: g.res, lg: g.lg }));
  return { home, away, games: { home: pub(hg), away: pub(ag) }, legs };
}
const api = async u => {
  const d = await loadDB(), url = new URL(u, "http://x"), q = k => url.searchParams.get(k), p = url.pathname;
  if (p === "/api/status") return { updated_at: d.updated_at, matches: d.matches.length, fixtures: d.fx.length, status: d.status, leagues: d.leagues };
  if (p === "/api/days") { const c = {}; d.fx.forEach(f => { const k = f.kickoff.slice(0,10); c[k] = (c[k]||0) + 1; });
    return { total: d.fx.length, days: Object.keys(c).sort().map(k => ({ date: k, count: c[k] })) }; }
  if (p === "/api/tips") {
    const day = q("day"), n = +q("n"), thr = +q("min_rate"), tips = [], categories = Object.fromEntries(CATS.map(c => [c, 0]));
    for (const fx of d.fx) {
      if (day !== "all" && fx.kickoff.slice(0,10) !== day) continue;
      for (const l of evaluate(fx.home, fx.away, n, false, thr, fx).legs) if (l.strongest) { tips.push({ fixture: fx, ...l }); categories[l.cat]++; }
    }
    tips.sort((a, b) => b.min_rate - a.min_rate || b.rate - a.rate || b.n_hits - a.n_hits || a.fixture.kickoff.localeCompare(b.fixture.kickoff));
    return { count: tips.length, categories, tips };
  }
  const m = p.match(/^\/api\/match\/(\d+)/);
  if (m) { const fx = d.fxAll.find(f => f.id === +m[1]); if (!fx) throw new Error("Maç bulunamadı");
    return { fixture: fx, ...evaluate(fx.home, fx.away, +q("n"), q("venue") === "split", +q("min_rate"), fx) }; }
  throw new Error("bilinmeyen istek");
};

/* Kupon: seçilen ayakların aynı maçlarda BİRLİKTE kaç kez tuttuğu */
function drawSlip(id){
  const set = state.slip[id], picked = M.legs.filter(l => set.has(l.id));
  if (!picked.length) {
    $("#slip").innerHTML = `<h3>Bet Builder</h3><div class="hint">Bir ayağı eklemek için + işaretine bas.<br>Seçtiğin ayakların son maçlarda birlikte kaç kez tuttuğunu burada görürsün.</div>`;
    return;
  }
  const combo = role => {
    const ls = picked.filter(l => l.sides.some(s => s.role === role));
    if (!ls.length) return null;
    const len = M.games[role].length; let hit = 0, tot = 0;
    for (let k = 0; k < len; k++) {
      const vals = ls.map(l => l.sides.find(s => s.role === role).strip[k]);
      if (vals.some(v => v === null || v === undefined)) continue;
      tot++; if (vals.every(v => v === 1)) hit++;
    }
    return { hit, tot, n: ls.length };
  };
  const rows = [["home", M.home], ["away", M.away]].map(([r, t]) => {
    const c = combo(r); if (!c) return "";
    return `<div class="lineitem"><span>${esc(t)} maçlarında (${c.n} ayak)</span><span class="badge ${badgeCls(c.tot ? c.hit/c.tot : 0)}">${c.hit}/${c.tot}</span></div>`;
  }).join("");
  $("#slip").innerHTML = `<h3>Bet Builder · ${picked.length} ayak</h3>
    ${picked.map(l=>`<div class="leg"><span>${esc(l.label)}</span><button data-rm="${esc(l.id)}">✕</button></div>`).join("")}
    <div class="combo"><b>Hepsi birlikte tuttu</b>${rows}</div>
    <div class="note">Her takım için, seçilen ayakların o takımın aynı maçında aynı anda tuttuğu maç sayısı.</div>`;
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { set.delete(b.dataset.rm); drawMatch(id); });
}

const SSTATS = [
  { key: "sf", against: "sa", name: "Şut", lines: [4.5,5.5,6.5,7.5,8.5,9.5,10.5,11.5,12.5,13.5,14.5,15.5,16.5,17.5,18.5,19.5,20.5] },
  { key: "tf", against: "ta", name: "İsabetli şut", lines: [0.5,1.5,2.5,3.5,4.5,5.5,6.5,7.5,8.5,9.5] },
  { key: "cf", against: "ca", name: "Korner", lines: [0.5,1.5,2.5,3.5,4.5,5.5,6.5,7.5,8.5,9.5,10.5] },
  { key: "gf", against: "ga", name: "Gol", lines: [0.5,1.5,2.5,3.5] },
  { key: "kf", against: "ka", name: "Kart", lines: [0.5,1.5,2.5,3.5,4.5] },
];
const S = state.s = { dir: "both", n: 10, minHit: 0.7, sameLg: false, oppMin: 0, date: "any", leagues: null, q: "", market: "all", sort: "form", page: 0, onlyOdds: true, minOdd: 1.4, split: false, showMissing: false };
const D = state.d = { open: false };

function gamesFor(team, n, lg, venue){
  let l = DB.byTeam[team] || [];
  if (lg) l = l.filter(m => m[0] === lg);
  if (venue === "home") l = l.filter(m => m[2] === team);
  if (venue === "away") l = l.filter(m => m[3] === team);
  return l.slice(0, n).map(m => ({ ...view(m, team), lg: m[0] }));
}
function hitOf(vals, line, dir){
  let h = 0, t = 0;
  for (const v of vals) { if (v == null) continue; t++; if (dir === "over" ? v > line : v < line) h++; }
  return { h, t };
}
const enough = (t, n) => t >= Math.min(5, n);

let _rowsKey = null, _rows = [];
function buildRows(){
  const thr = Math.max(S.minHit, 0.5), key = [S.n, S.sameLg, S.split, thr, DB.updated_at, DB.frKey].join("|");
  if (key === _rowsKey) return _rows;
  const rows = [];
  for (const fx of DB.fx) {
    const lg = S.sameLg ? fx.div : null;
    for (const [team, opp, side] of [[fx.home, fx.away, "home"], [fx.away, fx.home, "away"]]) {
      const tv_ = S.split ? side : null, ov_ = S.split ? (side === "home" ? "away" : "home") : null;
      const tg = gamesFor(team, S.n, lg, tv_), og = gamesFor(opp, S.n, lg, ov_);
      for (const st of SSTATS) {
        const tv = tg.map(g => g[st.key]), ov = og.map(g => g[st.against]);
        const nums = tv.filter(v => v != null), avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
        const okey = TEAM_ODD_KEY[st.key] ? TEAM_ODD_KEY[st.key][side === "home" ? 0 : 1] : null;
        const table = okey && fx.odds ? fx.odds[okey] : null;
        const push = (dir, L, odd) => {
          const r = hitOf(tv, L, dir); if (!enough(r.t, S.n)) return;
          const o = hitOf(ov, L, dir);
          const ok_ = okey ? `${okey}|${L}|${dir === "over" ? "o" : "u"}` : null;
          rows.push({ fx, team, opp, side, st, dir, line: +L, fh: r.h, ft: r.t, form: r.h / r.t, miss: tv.length - r.t,
                      open: ok_ && fx.open ? fx.open[ok_] || null : null,
                      oh: o.h, ot: o.t, oform: enough(o.t, S.n) ? o.h / o.t : null, avg, odd: odd || null });
        };
        for (const dir of ["over", "under"]) {
          const offered = table ? Object.keys(table).filter(L => table[L][dir === "over" ? 1 : 0] >= 1.02) : [];
          if (offered.length) { offered.forEach(L => push(dir, L, table[L][dir === "over" ? 1 : 0])); continue; }
          const ls = dir === "over" ? [...st.lines].reverse() : st.lines;      // oran yoksa: eşiği geçen en zor çizgi
          for (const L of ls) { const r = hitOf(tv, L, dir); if (enough(r.t, S.n) && r.h / r.t >= thr) { push(dir, L, null); break; } }
        }
      }
    }
  }
  _rowsKey = key; _rows = rows; return rows;
}
function dateOk(ko){
  if (S.date === "any") return true;
  const t = new Date(ko).getTime(), now = Date.now();
  if (S.date === "today") return ko.slice(0, 10) === todayStr();
  const h = { "24h": 24, "2d": 48, "3d": 72, "7d": 168 }[S.date];
  return t <= now + h * 3600e3;
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  return buildRows().filter(r =>
    (S.dir === "both" || r.dir === S.dir) &&
    r.form >= S.minHit &&
    (!S.onlyOdds || r.odd) && (!r.odd || r.odd >= S.minOdd) &&
    (S.showMissing || !r.miss) &&
    (S.oppMin === 0 || (r.oform != null && r.oform >= S.oppMin)) &&
    dateOk(r.fx.kickoff) &&
    (!S.leagues || S.leagues.has(r.fx.div)) &&
    (!q || (r.fx.home + " " + r.fx.away + " " + r.fx.league).toLowerCase().includes(q)));
}
const pctCls = p => p == null ? "p-n" : p >= 0.8 ? "p-g" : p >= 0.6 ? "p-y" : "p-n";
const pctTxt = p => p == null ? "–" : Math.round(p * 100) + "%";
const dirTxt = d => d === "over" ? "Üst" : "Alt";
const edge = r => r.odd ? r.form - 1 / r.odd : null;
const edgeTxt = e => e == null ? "–" : (e > 0 ? "+" : "") + Math.round(e * 100);

let _vKey = null, _vRows = [];
function valueRows(){

  const rows = [];

      if (!info) continue;
      const tot = l.sides.reduce((a, s) => a + s.total, 0);
      const rate = tot ? l.n_hits / tot : 0;
      rows.push({ fx, l, odd: info.odd, open: info.open, pRaw: 1 / info.odd, pFair: info.p, fairOk: info.fair, rate, miss: missingOf(l) });
    }
  }
  _vKey = key; _vRows = rows; return rows;
}

  const legLine = (rec, l) => `<div class="dleg" style="grid-template-columns:22px minmax(0,1fr) 70px 46px">
      <span class="r ${l.r == null ? "" : l.r ? "ok" : "no"}">${l.r == null ? "•" : l.r ? "✓" : "✗"}</span>
      <div>${esc(pickLabel(rec, l))}<small>${PK_CAT[l.k] || ""}${l.r != null && rec.res ? (actualOf(l, rec.res) ? " · gerçekleşen: " + actualOf(l, rec.res) : "") : ""}</small></div>
      <span class="hist">${l.s}</span><b>${l.o.toFixed(2)}</b></div>`;
  const card = (rec, cls = "") => { const b = rec.ab, v = b.pe - b.pm;
    return `<div class="abcard ${cls}"><h4><span>${esc(rec.home)} – ${esc(rec.away)}</span><span>${b.r == null ? "" : `<span class="${b.r ? "ok" : "no"}">${b.r ? "✓ Tuttu" : "✗ Yattı"}</span>`}</span></h4>
      <div class="meta">${trDay(rec.ko).slice(0, 5)} ${trTime(rec.ko)} · ${esc(rec.lg || "")}${Array.isArray(rec.res) ? ` · ${rec.res[0]}-${rec.res[1]}` : ""}</div>
      ${b.legs.map(l => legLine(rec, l)).join("")}
      <div class="abfoot"><div><span>Kombine oran</span><b>${b.O.toFixed(2)}</b></div>
        <div title="Ayakların takımların son maçlarında birlikte tutma oranından"><span>Geçmişe göre</span><b>${pctf(b.pe)}</b></div>
        <div title="Ayakların marjsız olasılıklarının çarpımı"><span>Oranlara göre</span><b>${pctf(b.pm)}</b></div>
        <div><span>Fark</span><b class="${v > 0 ? "ok" : "no"}">${v > 0 ? "+" : ""}${Math.round(v * 100)}</b></div></div>
      <div class="meta" style="margin:6px 0 0">Birlikte tuttu: ev tarafı ${b.jh || "–"} · deplasman tarafı ${b.ja || "–"}</div></div>`; };
  // istatistik
  const st = arr => { const n = arr.length, w = arr.filter(x => x.r).length, profit = arr.reduce((a, x) => a + (x.r ? x.O - 1 : -1), 0);
    return { n, w, hit: n ? w / n : null, pe: n ? arr.reduce((a, x) => a + x.pe, 0) / n : null, pm: n ? arr.reduce((a, x) => a + x.pm, 0) / n : null, O: n ? arr.reduce((a, x) => a + x.O, 0) / n : null, profit, roi: n ? profit / n : null }; };
  const sb = st(done.map(r => r.ab));
  const kd = Object.entries(KUPON || {}).sort((a, b) => b[0].localeCompare(a[0]));
  const kdone = kd.filter(([, k]) => k.r != null).map(([, k]) => k), sk = st(kdone);
  const today = dayKey(new Date().toISOString()), kt = (KUPON || {})[today];
  const kRec = x => ({ home: x.home, away: x.away });
  const statBox = (t, s) => `<div class="tsum">
      <div><span>${t}</span><b>${s.n}</b></div>
      <div><span>Tuttu</span><b>${s.w}${s.n ? ` <small style="font-size:14px">(${pct(s.hit)})</small>` : ""}</b></div>
      <div><span>Geçmişe göre beklenen</span><b>${pct(s.pe)}</b></div>
      <div><span>Oranlara göre beklenen</span><b>${pct(s.pm)}</b></div>
      <div><span>Ort. kombine oran</span><b>${s.O ? s.O.toFixed(2) : "–"}</b></div>
      <div><span>Net (1 birim)</span><b class="${s.profit > 0 ? "ok" : s.profit < 0 ? "no" : ""}">${s.n ? (s.profit > 0 ? "+" : "") + s.profit.toFixed(2) : "–"}</b></div></div>`;
  const per = 12, pages = Math.max(1, Math.ceil(done.length / per)); AI.page = Math.min(AI.page, pages - 1);
  app.innerHTML = `
    <h1 style="margin-top:4px">AI-Builder</h1>
    <p class="sub">Sistem her maç için oranlı ayaklardan 2–3'ünü birleştirip en değerli builder'ı kurar; ayrıca her sabah farklı maçlardan 3 ayaklı bir "günün kuponu" oluşturur. Hepsi maç öncesi dondurulur ve sonuçları takip edilir.</p>
    <h3 class="th3">Günün kuponu ${kt ? `· ${today.slice(8, 10)}.${today.slice(5, 7)}` : ""}</h3>
    ${kt ? `<div class="abgrid"><div class="abcard kupon"><h4><span>3 maç · kombine ${kt.O.toFixed(2)}</span><span>${kt.r == null ? "" : `<span class="${kt.r ? "ok" : "no"}">${kt.r ? "✓ Tuttu" : "✗ Yattı"}</span>`}</span></h4>
      <div class="meta">Oluşturuldu: ${trTime(kt.made)} · sonradan değiştirilmez</div>
      ${kt.legs.map(x => `<div class="dleg" style="grid-template-columns:22px minmax(0,1fr) 70px 46px"><span class="r ${x.r == null ? "" : x.r ? "ok" : "no"}">${x.r == null ? "•" : x.r ? "✓" : "✗"}</span>
        <div>${esc(pickLabel(kRec(x), x))}<small>${trTime(x.ko)} · ${esc(x.home)} – ${esc(x.away)}</small></div><span class="hist">${x.s}</span><b>${x.o.toFixed(2)}</b></div>`).join("")}
      <div class="abfoot"><div><span>Kombine</span><b>${kt.O.toFixed(2)}</b></div><div><span>Geçmişe göre</span><b>${pctf(kt.pe)}</b></div><div><span>Oranlara göre</span><b>${pctf(kt.pm)}</b></div></div></div></div>`
      : `<div class="list"><div class="empty">Bugünün kuponu henüz yok. Kupon her sabah 08:00'den sonraki ilk güncellemede, o gün oynanacak maçlardan oluşturulur.</div></div>`}
    <h3 class="th3">Yaklaşan maçlar (${up.length})</h3>
    ${up.length ? `<div class="abgrid">${up.map(r => card(r)).join("")}</div>` : `<div class="list"><div class="empty">Önümüzdeki 48 saatte builder kurulan maç yok. Builder'lar bir sonraki veri güncellemesinde (2 saatte bir) oluşur.</div></div>`}
    <h3 class="th3">Sonuçlar · maç içi builder</h3>${statBox("Builder", sb)}
    <h3 class="th3">Sonuçlar · günün kuponu</h3>${statBox("Kupon", sk)}
    ${kd.length ? `<table class="stbl ttbl"><tr><th>Gün</th><th>Ayaklar</th><th>Oran</th><th>Geçmişe göre</th><th>Sonuç</th></tr>
      ${kd.map(([d, k]) => `<tr><td>${d.slice(8, 10)}.${d.slice(5, 7)}</td><td>${k.legs.map(x => `<span class="${x.r == null ? "" : x.r ? "ok" : "no"}">${x.r == null ? "•" : x.r ? "✓" : "✗"}</span> ${esc(pickLabel(kRec(x), x))}`).join("<br>")}</td><td>${k.O.toFixed(2)}</td><td>${pctf(k.pe)}</td><td class="${k.r == null ? "" : k.r ? "ok" : "no"}"><b>${k.r == null ? "bekliyor" : k.r ? "✓" : "✗"}</b></td></tr>`).join("")}</table>` : ""}
    <h3 class="th3">Sonuçlanan builder'lar (${done.length})</h3>
    ${done.length ? `<div class="abgrid">${done.slice(AI.page * per, AI.page * per + per).map(r => card(r)).join("")}</div>
    <div class="pager"><span>${AI.page * per + 1}–${Math.min(done.length, (AI.page + 1) * per)} / ${done.length}</span><span><button class="btn" id="aprev">‹</button> <button class="btn" id="anext">›</button></span></div>` : `<div class="list"><div class="empty">Henüz sonuçlanan builder yok; ilk sonuçlar bugünkü maçlar bitince gelir.</div></div>`}
    <p class="note">"Geçmişe göre" olasılık, ayakların takımların son 10 maçında aynı anda tutup tutmadığından hesaplanır (ayaklar arasındaki ilişki böylece hesaba katılır); küçük örneklem yüzünden olduğundan yüksek çıkma eğilimindedir. "Oranlara göre" iddaa oranlarının marjsız olasılıklarının çarpımıdır. Kombine oran ayak oranlarının çarpımıdır; aynı maçtan ilişkili ayaklarda bahis sitelerinin builder oranı genelde bundan düşüktür, bu yüzden "Net" iyimser bir üst sınır gibi okunmalıdır.</p>`;
  const pv = $("#aprev"), nx = $("#anext");
  if (pv) pv.onclick = () => { if (AI.page > 0) { AI.page--; renderAI(); } };
  if (nx) nx.onclick = () => { if (AI.page < pages - 1) { AI.page++; renderAI(); } };
}

/* ------------------------------ YÖNLENDİRME ------------------------------ */
function route(){
  closeDrawer();
  const h = location.hash, m = h.match(/^#\/match\/(\d+)/), scr = h.startsWith("#/screener"), vl = h.startsWith("#/value"), tk = h.startsWith("#/track"), dy = h.startsWith("#/days"), ai = h.startsWith("#/ai");
  $("#nav-ps").classList.toggle("on", scr); $("#nav-vl").classList.toggle("on", vl); $("#nav-tk").classList.toggle("on", tk); $("#nav-dy").classList.toggle("on", dy); $("#nav-ai").classList.toggle("on", ai); $("#nav-bb").classList.toggle("on", !scr && !vl && !tk && !dy && !ai);
  (m ? renderMatch(+m[1]) : scr ? renderScreener() : vl ? renderValue() : tk ? renderTrack() : dy ? renderDays() : ai ? renderAI() : renderList()).catch(e => showSetup(e.message === "NO_SOURCE" ? "" : e.message));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("#cfg").onclick = () => showSetup("");
$("#frToggle").checked = getFr();
$("#frToggle").onchange = e => { setFr(e.target.checked); applyFriendly(); route(); };
loadStatus().catch(()=>{}); route();
</script>
</body>
</html>
